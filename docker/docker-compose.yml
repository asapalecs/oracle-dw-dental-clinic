# Pornire: docker compose -f docker/docker-compose.yml up -d
# Primul start dureaza 1-3 minute.

services:
  oracle:
    # latest-lite: imagine nativa arm64 si mult mai mica decat varianta completa
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: stoma-oracle
    restart: unless-stopped

    ports:
      - "1521:1521"
      - "5500:5500"

    environment:
      # Trebuie sa coincida cu ORACLE_SYS_PASSWORD din .env
      ORACLE_PWD: Oracle123
      ORACLE_CHARACTERSET: AL32UTF8

    # Fara volum pe /opt/oracle/oradata: imaginea lite are baza de date
    # inclusa acolo, iar un volum o ascunde si Oracle nu mai porneste (ORA-01110).

    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

    # Evita ORA-00845 (default-ul Docker de 64 MB e prea mic)
    shm_size: 2gb
